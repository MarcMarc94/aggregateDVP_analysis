# ══════════════════════════════════════════════════════════════════════════
# Gene list per vocabulary label.
#
# WHAT THIS IS FOR
# A label names a module; these are the genes that name means. A term is then
# scored against the label it was given:
#     purity   = |leading edge ∩ list| / |leading edge|
#     coverage = |leading edge ∩ list| / |list|
# and a cell may only be drawn from a term that clears both floors.
#
# WHY NOT THE CLUSTER'S OWN CORE GENES
# The core is the intersection of the members' leading edges, so scoring a
# member against it is circular: a term scores high purity against a core it
# helped define, however little of the named module it contains. The case that
# exposed this: GOBP_SIGNAL_RELEASE was drawn for "PKA and phosphodiesterase
# signalling" with 2 PKA/PDE genes in a 69-gene leading edge, while scoring well
# against its own cluster core. Scoring against an independent list also lets a
# better term be found in a cluster that never received a representative, which
# is where REACTOME_DARPP_32_EVENTS, the TRiC term and REACTOME_HSF1_ACTIVATION
# all sat.
#
# HOW THESE WERE WRITTEN
# From the label name, by hand, before looking at any leading edge. Complexes are
# listed by their subunits; pathways by their canonical enzymes and receptors.
# They are deliberately generous — a list too narrow makes a legitimate broad
# term fail — but never contain a gene that would let an unrelated term pass.
#
# MAINTAINING
# A new label needs an entry here before it can be drawn. Widen a list when a
# term that plainly measures the module fails the floor; never widen it to admit
# a term you could not defend by name.
# ══════════════════════════════════════════════════════════════════════════

