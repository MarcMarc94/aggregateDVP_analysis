# Environment for the aggregate DVP analysis notebooks.
# Create:  conda env create -f environment.yml
# Kernel:  conda activate aggregateDVP_analysis
#          python -m ipykernel install --user --name aggregateDVP_analysis
#
# Versions are the ones that produced the published results, except
# alphapepttools, which is the released v0.2.0.
name: aggregateDVP_analysis
channels:
  - conda-forge
dependencies:
  - python=3.12
  - cairo=1.18.4              # C library that cairosvg calls
  - pip
  - pip:
      - alphapepttools @ git+https://github.com/MannLabs/alphapepttools.git@v0.2.0
      - alphabase==1.8.1
      - anndata==0.12.10
      - numpy==2.3.5
      - pandas==2.3.3
      - scipy==1.18.0
      - scikit-learn==1.8.0
      - statsmodels==0.14.6
      - inmoose==0.9.1        # limma (lmFit, eBayes); also needed by at.tl.diff_exp_ebayes
      - scanpy==1.12
      - decoupler==2.1.4
      - gseapy==1.3.0
      - pyarrow==23.0.1
      - pyyaml==6.0.3
      - matplotlib==3.10.8
      - seaborn==0.13.2       # heatmaps (src/heatmap.py)
      - adjusttext==1.3.0
      - openpyxl==3.1.5       # pandas reads LITERATURE_MASTER.xlsx with it (CrossSystem)
      - pillow==12.1.1
      - cairosvg==2.8.2
      - svgutils==0.3.4
      - ipython==9.10.0
      - ipykernel==7.2.0
